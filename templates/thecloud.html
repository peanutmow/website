<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#03040a">
    <title>{{ title }}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #03040a;
            --line: rgba(255, 255, 255, 0.08);
        }

        html, body {
            width: 100%;
            height: 100%;
            background: var(--bg);
            overflow: hidden;
        }

        body { user-select: none; }

        body.no-webgl {
            background:
                radial-gradient(ellipse at 50% 55%, rgba(48, 96, 200, 0.22), transparent 58%),
                radial-gradient(ellipse at 62% 44%, rgba(120, 70, 210, 0.14), transparent 52%),
                var(--bg);
        }

        #cloud {
            position: fixed;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
        }

        .grid {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(to right, var(--line) 1px, transparent 1px),
                linear-gradient(to bottom, var(--line) 1px, transparent 1px);
            background-size: calc(100% / 12) calc(100% / 8);
            -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 10%, transparent 76%);
            mask-image: radial-gradient(circle at 50% 50%, #000 10%, transparent 76%);
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <canvas id="cloud" aria-hidden="true"></canvas>
    <div class="grid" aria-hidden="true"></div>

    <script src="/static/thecloud.js?v=12" defer></script>
</body>
</html>
