<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>embed scene</title>
    <style>
        /* The recording surface for the Discord artwork. Fixed size on purpose:
           the recorder captures exactly these pixels, and the layout has to be
           identical every time the assets are regenerated. */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 1200px; height: 600px; overflow: hidden; background: #000; }
        #embed-water {
            width: 1200px;
            height: 600px;
            color: #fff;
            font-family: 'Courier New', monospace;
            white-space: pre;
            line-height: 1;
            letter-spacing: 0;
            text-shadow: 0 0 4px rgba(255,255,255,0.3), 0 0 12px rgba(255,255,255,0.1);
            user-select: none;
        }
    </style>
</head>
<body>
    <pre id="embed-water" aria-hidden="true"></pre>
    <script src="/water-sim.js"></script>
    <script>
        // `window.__arm()` is called by tools/embed/record.mjs once the
        // screencast is running, so the GIF starts on the first frame of the
        // motion instead of however far the page happened to get.
        //
        // The scene is deliberately text-free: the artwork is the water, and
        // letters only made the surface look like a screenshot of the site.
        (function () {
            'use strict';
            var sim = null;

            // Ink and rotation, spread across the frame. Without this the first
            // frame would be an empty black rectangle — and a single wake can
            // drift out of shot, leaving holes in the composition.
            function seed() {
                var g = sim.grid();
                var spots = [
                    [0.22, 0.34], [0.38, 0.24], [0.56, 0.30], [0.74, 0.40],
                    [0.30, 0.56], [0.50, 0.64], [0.68, 0.58], [0.84, 0.62],
                    [0.46, 0.44]
                ];
                spots.forEach(function (spot, i) {
                    var c = g.cols * spot[0];
                    var r = g.rows * spot[1];
                    sim.droplet(c, r, 0.42, 1);
                    sim.vortex(c, r, i % 2 ? -0.22 : 0.22);
                });
            }

            window.__arm = function () {
                if (sim) return sim;
                sim = window.createWaterSim({
                    mount: document.getElementById('embed-water'),
                    buttons: [],
                    text: false,
                    size: function () { return { width: 1200, height: 600 }; }
                });

                seed();

                // Three invisible fingers draw slow, phase-shifted
                // figure-eights. One alone leaves a single wandering streak
                // with most of the frame empty; three fill the surface with
                // interleaved wakes that read as one turbulent pool.
                var t = 0;
                var tick = 0;
                setInterval(function () {
                    t += 0.045;
                    tick++;
                    var g = sim.grid();
                    for (var k = 0; k < 3; k++) {
                        var phase = t + k * 2.1;
                        var c = g.cols * (0.50 + Math.sin(phase * 1.1) * 0.31);
                        var r = g.rows * (0.50 + Math.sin(phase * 2.2 + k * 1.7) * 0.26);
                        sim.droplet(c, r, 0.16, 1);
                        if (tick % 5 === 3) sim.vortex(c, r, k % 2 ? -0.34 : 0.34);
                    }
                }, 50);

                return sim;
            };

            // A person opening this page should not stare at a blank screen:
            // the recorder arms within ~2s, so this only fires when nobody is
            // driving Chrome.
            setTimeout(function () { if (!sim) window.__arm(); }, 3000);
        })();
    </script>
</body>
</html>
