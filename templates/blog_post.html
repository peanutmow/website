<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=PT+Serif:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/blog-article.css">
</head>
<body>
    <div class="page-wrap">
        <a href="/blog" class="back">&larr; Back</a>
        <h1>{{ post.title }}</h1>
        <div class="meta">{{ post.date }}{% if post.category %} &middot; {{ post.category }}{% endif %}</div>
        <div class="content">{{ content_html|safe }}</div>
    </div>
</body>
</html>
