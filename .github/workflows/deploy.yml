name: Deploy to Uberspace
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl-tools (static link)
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binary (static, for the server)
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Install lftp + sshpass
        run: sudo apt-get install -y lftp sshpass

      - name: Deploy to Uberspace
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          # 1) Upload static assets first, then the binary LAST so the
          #    mirror --delete never removes it (it's not in the local tree).
          #    NOTE: use RELATIVE paths (html/...) — lftp starts in the SFTP
          #    user's home dir. No explicit mkdir: lftp's `mkdir -p` fails
          #    with "Access failed" on dirs that already exist (like html/);
          #    mirror creates any needed dirs by itself.
          lftp -u "$SFTP_USERNAME,$SFTP_PASSWORD" sftp://$SFTP_HOST:$SFTP_PORT <<EOF
          set sftp:auto-confirm yes
          set cmd:fail-exit yes
          set net:max-retries 3
          mirror --reverse --delete --verbose \
            --exclude=.git/ --exclude=.github/ --exclude=target/ \
            --exclude=node_modules/ --exclude-glob=*.md \
            --exclude=alice-website \
            ./ html/
          put target/x86_64-unknown-linux-musl/release/alice-website \
            -o html/alice-website
          bye
          EOF

          # 2) Make binary executable, install service, set web backend.
          #    Use the canonical web root (/var/www/virtual/<user>/html) — in a
          #    non-login shell $HOME may resolve to /home/<user> and be wrong.
          #    The unit is written inline so it doesn't depend on uploads.
          sshpass -p "$SFTP_PASSWORD" ssh -p "$SFTP_PORT" -o StrictHostKeyChecking=no \
            "$SFTP_USERNAME@$SFTP_HOST" "SFTP_USER='$SFTP_USERNAME' bash -s" <<'REMOTE'
          set -e
          USER_NAME="${SFTP_USER:?SFTP_USER not set}"
          APP_DIR="/var/www/virtual/$USER_NAME/html"
          SERVICE_NAME="alice-website"
          REAL_HOME="$(getent passwd "$USER_NAME" | cut -d: -f6)"
          [ -n "$REAL_HOME" ] || REAL_HOME="$HOME"

          # systemd user session setup for non-login shells (CI):
          # without XDG_RUNTIME_DIR, `systemctl --user` fails with
          # "Failed to get D-Bus connection". Enable linger so the
          # service also survives logout / starts at boot.
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          loginctl enable-linger "$USER_NAME" 2>/dev/null || true

          chmod +x "$APP_DIR/alice-website"
          mkdir -p "$REAL_HOME/.config/systemd/user"
          printf '%s\n' \
            '[Unit]' \
            'Description=Alice Website (Rust/axum SSR)' \
            'After=network.target' \
            '' \
            '[Service]' \
            "WorkingDirectory=$APP_DIR" \
            "ExecStart=$APP_DIR/alice-website" \
            'Restart=always' \
            'RestartSec=2' \
            'Environment=RUST_LOG=info' \
            '' \
            '[Install]' \
            'WantedBy=default.target' \
            > "$REAL_HOME/.config/systemd/user/$SERVICE_NAME.service"
          systemctl --user daemon-reload
          systemctl --user enable --now "$SERVICE_NAME" || true
          systemctl --user restart "$SERVICE_NAME"
          systemctl --user --no-pager status "$SERVICE_NAME"
          command -v uberspace >/dev/null 2>&1 || export PATH="$PATH:/usr/local/bin"
          uberspace web backend set / --http --port 8080
          REMOTE
