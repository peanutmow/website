<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery — {{ site.name }}</title>
    {% include "meta.html" %}
    <link rel="preconnect" href="https://live.staticflickr.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/gallery.css">
</head>
<body>
    <div class="grain" aria-hidden="true"></div>

    <header class="topbar">
        <a class="back" href="/">← {{ site.name }}</a>
        <div class="title-wrap">
            <h1>Gallery</h1>
            <p class="sub">an archive of light <span class="dot">·</span> <span id="frame-count">—</span> frames</p>
        </div>
        <div class="lab-mark" aria-hidden="true"><span>film lab</span><span>35mm · colour</span></div>
    </header>

    <main class="page">
        <section class="controls" aria-label="Filter the archive">
            <div class="spectrum-wrap">
                <div class="spectrum-labels" aria-hidden="true">
                    <span>0°</span><span>120°</span><span>240°</span><span>360°</span>
                </div>
                <div class="spectrum" id="spectrum" role="slider" tabindex="0"
                     aria-label="Filter frames by colour" aria-valuemin="0" aria-valuemax="360" aria-valuenow="0">
                    <div class="spectrum-track" aria-hidden="true"></div>
                    <div class="spectrum-handle" id="spectrum-handle" aria-hidden="true"></div>
                </div>
                <div class="spectrum-readout">
                    <span class="readout-name" id="spectrum-name">all light</span>
                    <span class="readout-count" id="spectrum-count"></span>
                    <span class="readout-spacer"></span>
                    <button type="button" class="mono-toggle" id="mono-toggle" aria-pressed="false" title="Show only monochrome frames">mono</button>
                    <button type="button" class="clear-btn" id="clear-filters" hidden>reset</button>
                </div>
            </div>
            <div class="tag-row" id="tag-row" aria-label="Filter by tag"></div>
        </section>

        <div id="archive"></div>
        <noscript><p class="empty">This archive needs JavaScript to develop its frames.</p></noscript>
        <p class="empty" id="empty" hidden>no frames match this light.</p>
    </main>

    <footer class="foot">
        <span id="foot-count"></span>
        <a href="https://www.flickr.com/photos/185219841@N08/" target="_blank" rel="noopener">source negatives ↗</a>
    </footer>

    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
        <div class="lb-backdrop" data-close></div>
        <button type="button" class="lb-close" id="lb-close" aria-label="Close viewer">✕</button>
        <button type="button" class="lb-nav lb-prev" id="lb-prev" aria-label="Previous frame">‹</button>
        <button type="button" class="lb-nav lb-next" id="lb-next" aria-label="Next frame">›</button>
        <figure class="lb-figure">
            <div class="lb-stage">
                <img id="lb-img" alt="">
            </div>
            <figcaption class="lb-label" id="lb-label"></figcaption>
        </figure>
        <div class="lb-counter" id="lb-counter"></div>
    </div>

    <script type="application/json" id="gallery-data">{{ photos_json | safe }}</script>
    <script src="/static/gallery.js" defer></script>
</body>
</html>
