[package]
name = "alice-website"
version = "0.1.0"
edition = "2021"
description = "Alice's personal website — rewritten in Rust with SSR"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "compression-gzip"] }
minijinja = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = "0.11"
tracing = "0.1"
# The blog is a WriteFreely instance on the same host. Its feeds are read over
# loopback in plain HTTP, so this build deliberately carries no TLS client:
# the deploy cross-compiles to static musl, where OpenSSL/ring are a real
# liability, and nothing here ever talks to a remote HTTPS origin.
reqwest = { version = "0.12", default-features = false }
feed-rs = "2"
chrono = { version = "0.4", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
