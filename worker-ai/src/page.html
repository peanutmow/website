<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BunGPT</title>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0a0a0a;
            --panel: #0e0e11;
            --line: rgba(255,255,255,0.08);
            --line-strong: rgba(255,255,255,0.16);
            --text: rgba(255,255,255,0.85);
            --dim: rgba(255,255,255,0.4);
            --faint: rgba(255,255,255,0.22);
            --accent: #7fe3c6;
        }

        html, body { height: 100%; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Geist', 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }

        /* ── Header ─────────────────────────────── */
        header {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 0.9rem 1.2rem;
            border-bottom: 1px solid var(--line);
            background: rgba(255,255,255,0.015);
        }
        .brand { display: flex; align-items: center; gap: 1rem; min-width: 0; }
        .brand h1 {
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text);
            white-space: nowrap;
        }
        #reset {
            flex-shrink: 0;
            font-family: inherit;
            font-size: 0.65rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--dim);
            background: transparent;
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 0.5rem 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        #reset:hover { color: #fff; border-color: var(--line-strong); background: rgba(255,255,255,0.06); }
        #reset:active { transform: scale(0.96); }

        /* ── Chat area ──────────────────────────── */
        main {
            flex: 1;
            overflow-y: auto;
            padding: 1.2rem 1.2rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
            max-width: 760px;
            width: 100%;
            margin: 0 auto;
        }

        .msg { display: flex; flex-direction: column; max-width: 85%; }
        .msg.user { align-self: flex-end; align-items: flex-end; }
        .msg.assistant { align-self: flex-start; }

        .msg .body {
            font-family: 'Share Tech Mono', 'Courier New', monospace;
            font-size: 0.85rem;
            line-height: 1.55;
            white-space: pre-wrap;
            word-break: break-word;
            padding: 0.7rem 0.9rem;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--panel);
        }
        .msg.user .body {
            border-color: var(--line);
            background: rgba(255,255,255,0.05);
            color: var(--text);
        }
        .msg.assistant .body { border-color: rgba(127,227,198,0.18); }
        .msg.thinking .body::after {
            content: "";
            display: inline-block;
            width: 5px;
            height: 0.85rem;
            background: var(--accent);
            margin-left: 3px;
            vertical-align: -1px;
            animation: blink 0.9s steps(1) infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

        .msg.error .body { border-color: rgba(255,120,120,0.25); }

        /* ── Composer ───────────────────────────── */
        form.composer {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            max-width: 760px;
            width: 100%;
            margin: 0 auto;
            padding: 0.8rem 1.2rem 0.6rem;
        }
        .composer .prompt {
            font-family: 'Share Tech Mono', monospace;
            color: var(--accent);
            font-size: 0.95rem;
            user-select: none;
        }
        .composer input {
            flex: 1;
            font-family: 'Share Tech Mono', 'Courier New', monospace;
            font-size: 0.85rem;
            color: var(--text);
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 0.7rem 0.9rem;
            outline: none;
            transition: border-color 0.2s ease;
        }
        .composer input::placeholder { color: var(--faint); }
        .composer input:focus { border-color: var(--line-strong); }
        .composer button {
            font-family: inherit;
            font-size: 0.65rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--dim);
            background: transparent;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 0.7rem 1.1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .composer button:hover { color: #fff; border-color: var(--line-strong); background: rgba(255,255,255,0.06); }
        .composer button:active { transform: scale(0.96); }

    </style>
</head>
<body>
    <header>
        <div class="brand">
            <h1>BunGPT</h1>
        </div>
        <button id="reset" type="button">reset</button>
    </header>

    <main id="chat"></main>

    <form class="composer" id="composer" autocomplete="off">
        <span class="prompt">❯</span>
        <input id="input" type="text" placeholder="type a message" aria-label="message">
        <button type="submit">send</button>
    </form>

    <script>
        (function () {
            'use strict';

            var chatEl = document.getElementById('chat');
            var form = document.getElementById('composer');
            var input = document.getElementById('input');
            var resetBtn = document.getElementById('reset');

            var STORE_KEY = 'bungpt.history.v1';
            var history = [];
            try { history = JSON.parse(localStorage.getItem(STORE_KEY)) || []; } catch (e) {}

            function scroll() { chatEl.scrollTop = chatEl.scrollHeight; }

            function addBubble(role, text, extraClass) {
                var wrap = document.createElement('div');
                wrap.className = 'msg ' + role + (extraClass ? ' ' + extraClass : '');

                var body = document.createElement('div');
                body.className = 'body';
                body.textContent = text; // textContent = safe against HTML injection

                wrap.appendChild(body);
                chatEl.appendChild(wrap);
                scroll();
                return body;
            }

            var thinking = null;
            function showThinking() {
                if (thinking) return;
                var wrap = document.createElement('div');
                wrap.className = 'msg assistant thinking';
                var body = document.createElement('div');
                body.className = 'body';
                body.textContent = '…';
                wrap.appendChild(body);
                chatEl.appendChild(wrap);
                thinking = body;
                scroll();
            }
            function hideThinking() {
                if (thinking && thinking.parentNode) thinking.parentNode.remove();
                thinking = null;
            }

            function save() {
                try { localStorage.setItem(STORE_KEY, JSON.stringify(history.slice(-40))); } catch (e) {}
            }

            function send() {
                var text = input.value.trim();
                if (!text || thinking) return;
                input.value = '';
                history.push({ role: 'user', content: text });
                addBubble('user', text);
                save();
                showThinking();

                fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'content-type': 'application/json' },
                    body: JSON.stringify({ messages: history })
                }).then(function (res) {
                    return res.json().catch(function () { return {}; }).then(function (data) {
                        return { ok: res.ok, data: data };
                    });
                }).then(function (r) {
                    hideThinking();
                    if (!r.ok || r.data.error) {
                        addBubble('assistant', r.data.message || 'something went wrong, try again', 'error');
                        return; // don't put errors into the model's history
                    }
                    history.push({ role: 'assistant', content: r.data.reply });
                    addBubble('assistant', r.data.reply);
                    save();
                }).catch(function () {
                    hideThinking();
                    addBubble('assistant', 'connection error, try again', 'error');
                });
            }

            form.addEventListener('submit', function (e) {
                e.preventDefault();
                send();
            });

            resetBtn.addEventListener('click', function () {
                history = [];
                save();
                chatEl.innerHTML = '';
                input.focus();
            });

            // Boot: render saved history
            history.slice().forEach(function (m) { addBubble(m.role, m.content); });
            input.focus();
        })();
    </script>
</body>
</html>
