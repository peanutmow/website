<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Not Found</title>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            background: #000;
            color: rgba(255,255,255,0.6);
            font-family: 'Geist', 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 1.5rem;
        }
        h1 { font-size: 4rem; font-weight: 300; letter-spacing: 8px; color: rgba(255,255,255,0.15); }
        p { font-size: 0.75rem; letter-spacing: 3px; text-transform: uppercase; color: rgba(255,255,255,0.25); }
        a { color: rgba(255,255,255,0.4); text-decoration: none; border: 1px solid rgba(255,255,255,0.1); padding: 0.6rem 1.5rem; border-radius: 6px; font-size: 0.7rem; letter-spacing: 2px; transition: all 0.2s; }
        a:hover { color: rgba(255,255,255,0.8); border-color: rgba(255,255,255,0.3); }
    </style>
</head>
<body>
    <h1>404</h1>
    <p>The requested resource was not found in the archive.</p>
    <a href="/">Return to Interface</a>
</body>
</html>
