<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery — {{ site.name }}</title>
    <script>if (window.self !== window.top) document.documentElement.classList.add('embedded');</script>
    {% include "meta.html" %}
    <link rel="preconnect" href="https://live.staticflickr.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400&family=Instrument+Serif:ital@0;1&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/gallery.css">
</head>
<body>
    <div class="atmosphere" aria-hidden="true"></div>

    <header class="masthead">
        <div class="masthead-bar">
            <a class="back" href="/">← {{ site.name }}</a>
            <span class="eyebrow">Gallery</span>
        </div>

        <div class="masthead-main">
            <h1><span class="the">The</span><em>Archive</em></h1>
            <div class="masthead-aside">
                <p class="lede"><span id="frame-count">—</span> Photos so far.</p>
                <p class="note">In my collection.</p>
            </div>
        </div>

        <div class="masthead-rule">
            <span>contact sheets <span id="sheet-count">—</span></span>
            <span>sort by color</span>
        </div>
    </header>

    <main class="page">
        <section class="index" aria-label="Filter the archive">
            <div class="index-row">
                <span class="index-key">Colour</span>
                <div class="swatches" id="swatches"></div>
            </div>
            <div class="index-row">
                <span class="index-key">Index</span>
                <div class="tags" id="tags"></div>
            </div>
            <div class="index-foot">
                <span id="status">all frames</span>
                <button type="button" id="reset" hidden>clear filter</button>
            </div>
        </section>

        <div id="archive"></div>
        <noscript><p class="empty">This archive needs JavaScript to develop its frames.</p></noscript>
        <p class="empty" id="empty" hidden>nothing in the archive answers to that.</p>
    </main>

    <footer class="colophon">
        <span id="foot-count">—</span>
        <span class="colophon-note">an archive of color</span>
        <a href="https://www.flickr.com/photos/185219841@N08/" target="_blank" rel="noopener">source negatives ↗</a>
    </footer>

    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
        <div class="lb-backdrop" data-close></div>
        <button type="button" class="lb-close" id="lb-close" aria-label="Close viewer">✕</button>
        <button type="button" class="lb-nav lb-prev" id="lb-prev" aria-label="Previous frame">‹</button>
        <button type="button" class="lb-nav lb-next" id="lb-next" aria-label="Next frame">›</button>
        <figure class="lb-figure">
            <div class="lb-stage">
                <img id="lb-img" alt="">
            </div>
            <figcaption class="lb-label" id="lb-label"></figcaption>
        </figure>
        <div class="lb-counter" id="lb-counter"></div>
    </div>

    <script type="application/json" id="gallery-data">{{ photos_json | safe }}</script>
    <script src="/static/gallery.js" defer></script>
</body>
</html>
