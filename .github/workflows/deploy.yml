name: Deploy to Uberspace
on:
  push:
    branches:
      - main
    # Docs, the AI worker (deployed by its own workflow) and CI config don't
    # change the site, so don't spend a full build+deploy on them.
    paths-ignore:
      - '**.md'
      - 'worker-ai/**'
      - '.github/**'
  # The gallery is generated from the public photostream. A nightly deploy
  # refreshes it even when the repository itself hasn't changed.
  schedule:
    - cron: '17 4 * * *'
  # Lets you deploy on demand from the Actions tab (paths-ignore also means a
  # workflow-only change doesn't trigger a deploy by itself).
  workflow_dispatch:
concurrency:
  group: deploy-uberspace
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # sshpass/rsync are needed by the background sync below, so install them
      # first. The runner image ships fresh apt lists, so the common case
      # installs straight away; the update is only a fallback for stale lists.
      - name: Install transfer tools (sshpass, rsync)
        run: |
          sudo apt-get install -y --no-install-recommends sshpass rsync \
            || {
              sudo apt-get update -qq
              sudo apt-get install -y --no-install-recommends sshpass rsync
            }

      # Everything that does not need the compiled binary runs here, in the
      # background, while Rust builds: the Flickr crawl and the incremental
      # rsync of the site files. The deploy step then only ships the binary
      # and touches the service.
      - name: Start site sync (background)
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SSHPASS: ${{ secrets.SFTP_PASSWORD }}
        run: |
          cat > "$RUNNER_TEMP/sync.sh" <<'SYNC'
          set -uo pipefail
          APP_DIR="/var/www/virtual/$SFTP_USERNAME/html"
          # Gallery refresh is best-effort: a Flickr outage keeps the last copy.
          if python3 -m pip install --quiet --disable-pip-version-check pillow \
             && python3 tools/gallery/sync.py; then
            :
          else
            echo "[gallery] refresh failed; keeping the previous photos.json"
          fi
          rsync -rlp --checksum --delete --delete-after --itemize-changes \
            --exclude=/.git/ --exclude=/.github/ --exclude=/.deploy/ \
            --exclude=/target/ --exclude=node_modules/ --exclude=__pycache__/ \
            --exclude='*.md' --exclude=/alice-website --exclude='/alice-website.*' \
            --exclude='*.tmp' \
            -e "sshpass -e ssh -p $SFTP_PORT -o StrictHostKeyChecking=no" \
            ./ "$SFTP_USERNAME@$SFTP_HOST:$APP_DIR/" && exit 0
          # Safety net: full lftp mirror if rsync is unusable on the host.
          echo "[rsync] failed; falling back to a full lftp mirror"
          sudo apt-get install -y --no-install-recommends lftp
          printf '%s\n' \
            'set sftp:auto-confirm yes' \
            'set cmd:fail-exit yes' \
            'set net:max-retries 3' \
            'mirror --reverse --delete --verbose --exclude=.git/ --exclude=.github/ --exclude=.deploy/ --exclude=target/ --exclude=node_modules/ --exclude=__pycache__/ --exclude-glob=*.md --exclude=alice-website ./ html/' \
            'bye' > "$RUNNER_TEMP/tree.lftp"
          lftp -u "$SFTP_USERNAME,$SFTP_PASSWORD" \
            "sftp://$SFTP_HOST:$SFTP_PORT" -f "$RUNNER_TEMP/tree.lftp"
          SYNC
          nohup bash -c 'bash "$RUNNER_TEMP/sync.sh"; echo $? > "$RUNNER_TEMP/sync.exit"' \
            > "$RUNNER_TEMP/sync.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/sync.pid"

      - name: Restore the built binary
        id: binary
        uses: actions/cache@v4
        with:
          path: .deploy/alice-website
          key: alice-binary-v1-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'src/**', 'templates/**', 'gallery/curation.json', 'gallery/index.html', 'socials/**') }}

      # The runner image ships Rust, so adding the musl target is all that is
      # needed; the rustup installer is only a fallback for a bare image.
      - name: Add musl target
        if: steps.binary.outputs.cache-hit != 'true'
        run: |
          if ! rustup target add x86_64-unknown-linux-musl; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --target x86_64-unknown-linux-musl
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Cache Rust build
        if: steps.binary.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2

      - name: Build release binary (static, for the server)
        if: steps.binary.outputs.cache-hit != 'true'
        run: |
          # Pure-Rust deps, so the bundled musl linker is normally enough;
          # musl-tools is only installed if the link fails.
          cargo build --locked --release --target x86_64-unknown-linux-musl || {
            sudo apt-get install -y --no-install-recommends musl-tools
            cargo build --locked --release --target x86_64-unknown-linux-musl
          }
          mkdir -p .deploy
          # Symbols are dead weight over SFTP; GNU strip handles the static
          # musl ELF fine. Fall back to the unstripped file if it refuses.
          strip target/x86_64-unknown-linux-musl/release/alice-website \
            -o .deploy/alice-website \
            || cp target/x86_64-unknown-linux-musl/release/alice-website .deploy/alice-website

      # Join the background site sync (it ran during the build) before the
      # deploy touches the service.
      - name: Wait for site sync
        run: |
          if [ -f "$RUNNER_TEMP/sync.pid" ]; then
            pid="$(cat "$RUNNER_TEMP/sync.pid")"
            while kill -0 "$pid" 2>/dev/null; do sleep 1; done
          fi
          tail -n 40 "$RUNNER_TEMP/sync.log" 2>/dev/null || true
          if [ "$(cat "$RUNNER_TEMP/sync.exit" 2>/dev/null || echo 1)" -ne 0 ]; then
            echo "::error title=Site sync failed::the site files were not uploaded"
            exit 1
          fi

      - name: Deploy to Uberspace
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SSHPASS: ${{ secrets.SFTP_PASSWORD }}
          # Scheduled/manual runs re-verify the web backend; pushes trust the
          # marker so they don't pay for the ~5s API round-trip.
          VERIFY_BACKEND: ${{ github.event_name != 'push' }}
        run: |
          set -euo pipefail

          # The site files were already synced in the background (see the
          # "Start site sync" step), so only the binary is left. It goes to
          # alice-website.new: rsync writes a temp file and renames it, so the
          # running executable is never touched, and an identical (cached)
          # build is not transferred at all.
          APP_DIR="/var/www/virtual/$SFTP_USERNAME/html"
          # Reuse one SSH connection for the upload and the setup below.
          SSH_OPTS="-p $SFTP_PORT -o StrictHostKeyChecking=no \
                    -o ControlMaster=auto -o ControlPath=$RUNNER_TEMP/ssh.sock -o ControlPersist=60"
          RSYNC_SSH="sshpass -e ssh $SSH_OPTS"

          echo "==> [rsync] uploading binary ..."
          if ! rsync -p --checksum --itemize-changes -e "$RSYNC_SSH" \
               .deploy/alice-website \
               "$SFTP_USERNAME@$SFTP_HOST:$APP_DIR/alice-website.new"; then
            # lftp is only needed on this path, so it is not installed upfront.
            echo "!! [rsync] failed — falling back to lftp put" >&2
            sudo apt-get install -y --no-install-recommends lftp
            printf '%s\n' \
              'set sftp:auto-confirm yes' \
              'set cmd:fail-exit yes' \
              'set net:max-retries 3' \
              'put .deploy/alice-website -o html/alice-website.new' \
              'bye' > "$RUNNER_TEMP/binary.lftp"
            lftp -u "$SFTP_USERNAME,$SFTP_PASSWORD" \
              "sftp://$SFTP_HOST:$SFTP_PORT" -f "$RUNNER_TEMP/binary.lftp"
          fi

          # 2) Install/refresh the service and set the web backend.
          #    Uberspace manages persistent daemons with supervisord (NOT
          #    systemd user services — `systemctl --user` / linger don't
          #    exist there). Service config = one .ini in ~/etc/services.d/.
          echo "==> [ssh] running remote setup ..."
          sshpass -p "$SFTP_PASSWORD" ssh $SSH_OPTS \
            "$SFTP_USERNAME@$SFTP_HOST" \
            "SFTP_USER='$SFTP_USERNAME' VERIFY_BACKEND='$VERIFY_BACKEND' bash -l -s" <<'REMOTE'
          set -e
          trap 'echo "REMOTE FAILED at line $LINENO: $BASH_COMMAND"' ERR
          USER_NAME="${SFTP_USER:?SFTP_USER not set}"
          APP_DIR="/var/www/virtual/$USER_NAME/html"
          SERVICE_NAME="alice-website"
          REAL_HOME="$(getent passwd "$USER_NAME" | cut -d: -f6)"
          [ -n "$REAL_HOME" ] || REAL_HOME="$HOME"

          SERVICE_DIR="$REAL_HOME/etc/services.d"
          INI="$SERVICE_DIR/$SERVICE_NAME.ini"
          BACKEND_MARKER="$REAL_HOME/.alice-website-backend"
          BINARY_CHANGED=0
          CONFIG_CHANGED=0

          echo "[1/5] install binary"
          # Identical bytes mean there is nothing to swap -- and, just as
          # importantly, no reason to restart the service and drop requests.
          if [ -f "$APP_DIR/alice-website" ] && cmp -s "$APP_DIR/alice-website" "$APP_DIR/alice-website.new"; then
            echo "  binary unchanged"
          else
            mv -f "$APP_DIR/alice-website.new" "$APP_DIR/alice-website"
            chmod +x "$APP_DIR/alice-website"
            BINARY_CHANGED=1
          fi
          # Keep a copy next to the binary: the next deploy compares against it
          # and, when the rebuild is byte-identical, skips the upload entirely.
          [ -f "$APP_DIR/alice-website.new" ] || cp -p "$APP_DIR/alice-website" "$APP_DIR/alice-website.new"

          echo "[2/5] supervisord ini"
          mkdir -p "$SERVICE_DIR"
          # The blog is a WriteFreely instance on this same host, so the site
          # reads its feeds over loopback: plain HTTP, never off the machine,
          # which is why the binary carries no TLS client. Keep this port in
          # step with `port` in the WriteFreely config.ini.
          NEW_INI="$(mktemp "$SERVICE_DIR/.$SERVICE_NAME.XXXXXX")"
          # `supervisorctl restart` blocks until the program has been RUNNING
          # for startsecs, so keep this small — the server binds its port in
          # milliseconds and 60s turned every deploy into a 60s wait.
          printf '%s\n' \
            "[program:$SERVICE_NAME]" \
            "command=$APP_DIR/alice-website" \
            "directory=$APP_DIR" \
            'startsecs=2' \
            'autorestart=true' \
            'redirect_stderr=true' \
            'environment=BLOG_FEED_BASE="http://127.0.0.1:8082"' \
            > "$NEW_INI"
          if cmp -s "$NEW_INI" "$INI"; then
            rm -f "$NEW_INI"
            echo "  unchanged"
          else
            mv -f "$NEW_INI" "$INI"
            CONFIG_CHANGED=1
            echo "  updated"
          fi

          echo "[3/5] supervisorctl reread/update"
          STATUS="$(supervisorctl status "$SERVICE_NAME" 2>/dev/null || true)"
          if [ -z "$STATUS" ] || [ "$CONFIG_CHANGED" = 1 ]; then
            supervisorctl reread
            supervisorctl update
            STATUS="$(supervisorctl status "$SERVICE_NAME" 2>/dev/null || true)"
          else
            echo "  nothing changed"
          fi

          echo "[4/5] restart service"
          # Compare the executable the process is actually running with the one
          # on disk, so a deploy that got killed between swap and restart (or a
          # crashed process) still ends up on the current binary.
          PID="$(printf '%s\n' "$STATUS" | sed -n 's/.*pid \([0-9]\+\).*/\1/p')"
          RUNNING_BIN=""
          if [ -n "$PID" ]; then
            RUNNING_BIN="$(readlink "/proc/$PID/exe" 2>/dev/null || true)"
          fi
          if [ "$BINARY_CHANGED" = 1 ] || [ "$CONFIG_CHANGED" = 1 ] \
             || [ "$RUNNING_BIN" != "$APP_DIR/alice-website" ]; then
            supervisorctl restart "$SERVICE_NAME" || supervisorctl start "$SERVICE_NAME"
          else
            echo "  already running the current binary and config"
          fi
          supervisorctl status "$SERVICE_NAME" || true

          echo "[5/5] web backend"
          # `list`/`set` round-trip to the Uberspace API (~5s), so a push only
          # configures the backend until it is known to be correct; scheduled
          # and manual runs re-verify it.
          if [ "${VERIFY_BACKEND:-false}" = "true" ] \
             || [ "$(cat "$BACKEND_MARKER" 2>/dev/null || true)" != "http:8080" ]; then
            command -v uberspace >/dev/null 2>&1 || export PATH="$PATH:/usr/local/bin"
            if uberspace web backend list 2>/dev/null | grep -Eq '^/ http:8080([ ,]|$)'; then
              echo "  already http:8080"
            else
              uberspace web backend set / --http --port 8080
            fi
            printf '%s\n' "http:8080" > "$BACKEND_MARKER"
          else
            echo "  unchanged (re-verified on scheduled runs)"
          fi
          echo "REMOTE setup complete"
          REMOTE
          echo "==> [ssh] remote setup done"
