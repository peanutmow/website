name: Deploy AI worker to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - 'worker-ai/**'
  # Allows triggering manually from the Actions tab (e.g. after workflow fixes)
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pin a wrangler that supports wrangler.jsonc (>= 3.91.0). The action's
          # default (3.90.0) can't read wrangler.jsonc and fails the deploy.
          wranglerVersion: "4.125.0"
          workingDirectory: worker-ai
          command: deploy
