[package]
name = "wasm-app"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
wasm-water-sim = { path = "../wasm-sim", default-features = false }
gloo = { version = "0.11", features = ["events", "timers", "utils", "history", "storage", "render"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlElement", "HtmlImageElement",
    "HtmlButtonElement", "HtmlIFrameElement", "HtmlAudioElement",
    "HtmlCanvasElement", "HtmlPreElement", "Node", "NodeList",
    "DomTokenList", "DomStringMap", "Event", "EventTarget", "MouseEvent",
    "PointerEvent", "KeyboardEvent", "TouchEvent", "Touch", "TouchList",
    "History",
    "Location", "Storage", "UrlSearchParams", "MediaQueryList",
    "IntersectionObserver", "IntersectionObserverInit",
    "IntersectionObserverEntry", "Text",
    "TreeWalker", "NodeFilter", "DocumentFragment", "HtmlCollection",
    "Path2d", "CanvasRenderingContext2d", "ScrollIntoViewOptions",
    "ScrollBehavior", "ScrollToOptions", "DomRect", "Navigator",
    "CssStyleDeclaration", "FontFaceSet", "HtmlSpanElement", "HtmlDivElement",
    "HtmlAnchorElement", "HtmlBodyElement", "HtmlDocument", "DomParser", "Url",
    "MouseEventInit", "console",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-mutable-globals", "--enable-sign-ext"]
