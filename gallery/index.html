<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery — Alice</title>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            min-height: 100vh;
            background: linear-gradient(135deg, #050505 0%, #0f0f0f 50%, #080808 100%);
            color: #fff;
            font-family: 'Geist', 'Helvetica Neue', Arial, sans-serif;
        }

        /* ── Layout ── */
        .page-wrap {
            position: relative;
            z-index: 10;
            max-width: 100%;
            margin: 0 auto;
            padding: 2rem 1.5rem 4rem;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .page-header h1 {
            font-size: 1.1rem;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.5);
            font-weight: 300;
        }

        .back-link {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.2);
            text-decoration: none;
            letter-spacing: 2px;
            transition: color 0.3s;
        }
        .back-link:hover {
            color: rgba(255,255,255,0.6);
        }

        /* ── Filter tabs ── */
        .filters {
            display: flex;
            gap: 0.25rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 8px;
            padding: 0.3rem;
            background: rgba(255,255,255,0.02);
        }
        .filters button {
            font-family: inherit;
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: rgba(255,255,255,0.25);
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .filters button:hover {
            color: rgba(255,255,255,0.6);
            background: rgba(255,255,255,0.04);
        }
        .filters button.active {
            color: rgba(255,255,255,0.85);
            background: rgba(255,255,255,0.07);
        }

        /* ── Subtype filter tabs ── */
        .sub-filters {
            display: flex;
            gap: 0.25rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            padding: 0 0.15rem;
            min-height: 0;
            overflow: hidden;
            transition: min-height 0.3s, margin-bottom 0.3s, opacity 0.3s;
            opacity: 0;
            pointer-events: none;
        }
        .sub-filters.visible {
            min-height: 2rem;
            margin-bottom: 1.5rem;
            opacity: 1;
            pointer-events: auto;
        }
        .sub-filters button {
            font-family: inherit;
            font-size: 0.6rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 0.35rem 0.75rem;
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: 6px;
            background: transparent;
            color: rgba(255,255,255,0.15);
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .sub-filters button:hover {
            color: rgba(255,255,255,0.5);
            border-color: rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.03);
        }
        .sub-filters button.active {
            color: rgba(255,255,255,0.7);
            border-color: rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.05);
        }

        /* ── Gallery grid (fluid justified layout) ── */
        .gallery-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .gallery-row {
            display: flex;
            gap: 4px;
            width: 100%;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 3px;
            background: rgba(255,255,255,0.02);
            transition: opacity 0.3s ease;
            flex-shrink: 0;
        }
        .gallery-item.hidden {
            display: none;
        }
        .gallery-item:hover {
            opacity: 0.85;
        }

        .gallery-item img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
            -webkit-user-drag: none;
            user-select: none;
        }

        .gallery-item .type-tag {
            position: absolute;
            bottom: 4px;
            left: 4px;
            font-size: 0.5rem;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            padding: 0.15rem 0.4rem;
            border-radius: 2px;
            background: rgba(0,0,0,0.65);
            color: rgba(255,255,255,0.4);
            border: 1px solid rgba(255,255,255,0.06);
            pointer-events: none;
            line-height: 1;
        }

        .gallery-empty {
            text-align: center;
            padding: 3rem 1rem;
            color: rgba(255,255,255,0.15);
            font-size: 0.8rem;
            letter-spacing: 2px;
            display: none;
        }
        .gallery-empty.visible {
            display: block;
        }

        /* ── Add-item hint ── */
        .add-hint {
            margin-top: 3rem;
            text-align: center;
            font-size: 0.6rem;
            color: rgba(255,255,255,0.08);
            letter-spacing: 1px;
            line-height: 1.8;
        }
        .add-hint code {
            color: rgba(255,255,255,0.15);
        }

        /* ── Lightbox ── */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 9999;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.92);
            align-items: center;
            justify-content: center;
            flex-direction: column;
            cursor: zoom-out;
        }
        .lightbox.open {
            display: flex;
        }

        .lightbox .lb-img-wrap {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            max-width: 92vw;
            max-height: 88vh;
            cursor: default;
        }
        .lightbox .lb-img-wrap img {
            display: block;
            max-width: 100%;
            max-height: 88vh;
            object-fit: contain;
            border-radius: 4px;
            box-shadow: 0 4px 40px rgba(0,0,0,0.5);
            user-select: none;
            -webkit-user-drag: none;
        }

        .lightbox .lb-close {
            position: fixed;
            top: 1rem;
            right: 1.5rem;
            font-size: 1.4rem;
            color: rgba(255,255,255,0.3);
            background: none;
            border: none;
            cursor: pointer;
            font-family: inherit;
            letter-spacing: 2px;
            transition: color 0.25s;
            z-index: 10;
        }
        .lightbox .lb-close:hover {
            color: rgba(255,255,255,0.7);
        }

        .lightbox .lb-nav {
            position: fixed;
            top: 0; bottom: 0;
            width: clamp(80px, 20vw, 240px);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: rgba(255,255,255,0.08);
            transition: color 0.3s, background 0.3s;
            background: none;
            border: none;
            font-family: inherit;
            z-index: 5;
            padding: 0;
        }
        .lightbox .lb-nav:hover {
            color: rgba(255,255,255,0.5);
            background: rgba(255,255,255,0.02);
        }
        .lightbox .lb-prev {
            left: 0;
        }
        .lightbox .lb-next {
            right: 0;
        }

        .lightbox .lb-counter {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.6rem;
            letter-spacing: 3px;
            color: rgba(255,255,255,0.2);
            text-transform: uppercase;
        }

        .lightbox .lb-link {
            display: inline-block;
            padding: 0.35rem 0.75rem;
            margin-bottom: 0.5rem;
            font-size: 0.5rem;
            letter-spacing: 1.5px;
            color: rgba(255,255,255,0.15);
            text-decoration: none;
            text-transform: uppercase;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 3px;
            transition: color 0.25s, border-color 0.25s;
            background: rgba(0,0,0,0.3);
        }
        .lightbox .lb-link:hover {
            color: rgba(255,255,255,0.5);
            border-color: rgba(255,255,255,0.15);
        }
    </style>
</head>

];

        // ── Global subtypes ──
        // These work across ALL media types (photography, 3D art, misc).
        // Add or remove subtypes here — the filter buttons auto-generate.
        const subtypes = ['nature', 'experimental', 'portrait', 'street', 'abstract', 'architectural', 'organic', 'animal', 'sky', 'night', 'interior', 'black&white', 'stylized', 'dark', 'winter'];

        // ── Render ──
        const grid = document.getElementById('gallery-grid');
        const empty = document.getElementById('gallery-empty');
        const subFilterEl = document.getElementById('sub-filters');
        let currentFilter = 'all';
        let currentSubtype = null;

        // ── Pre-load images to get natural aspect ratios ──
        var imageCache = {};

        function preloadImages(arts, callback) {
            var loaded = 0;
            var total = arts.length;
            arts.forEach(function(art) {
                if (imageCache[art.src]) {
                    loaded++;
                    if (loaded === total) callback();
                    return;
                }
                var img = new Image();
                img.onload = function() {
                    imageCache[art.src] = img.naturalWidth / img.naturalHeight;
                    loaded++;
                    if (loaded === total) callback();
                };
                img.onerror = function() {
                    imageCache[art.src] = 1; // fallback square
                    loaded++;
                    if (loaded === total) callback();
                };
                img.src = art.src;
            });
            if (total === 0) callback();
        }

        function renderGallery(filter, subtype) {
            var filtered = filter === 'all'
                ? artworks
                : artworks.filter(function(a) { return a.type === filter; });

            if (subtype) {
                filtered = filtered.filter(function(a) { return a.subtypes && a.subtypes.indexOf(subtype) !== -1; });
            }

            grid.innerHTML = '';
            if (filtered.length === 0) {
                empty.classList.add('visible');
                return;
            }
            empty.classList.remove('visible');

            preloadImages(filtered, function() {
                // Balance portrait and landscape images for visual rhythm
                var balanced = balanceOrientations(filtered);
                layoutJustified(balanced);
                if (editMode) styleItemsForEditMode();
            });
        }

        // ── Balance orientations for visual rhythm ──
        function balanceOrientations(arts) {
            var portraits = [];
            var landscapes = [];
            var squares = [];

            arts.forEach(function(a) {
                var ratio = imageCache[a.src] || 1;
                if (ratio < 0.85) portraits.push(a);
                else if (ratio > 1.15) landscapes.push(a);
                else squares.push(a);
            });

            var result = [];
            var p = 0, l = 0, s = 0;
            var targetGroupSize = 3; // how many of dominant type before switching
            var mode = landscapes.length >= portraits.length ? 'landscape' : 'portrait';
            var count = 0;

            while (p < portraits.length || l < landscapes.length || s < squares.length) {
                if (mode === 'landscape' && l < landscapes.length) {
                    result.push(landscapes[l++]);
                    count++;
                    if (count >= targetGroupSize) { mode = 'portrait'; count = 0; }
                } else if (mode === 'portrait' && p < portraits.length) {
                    result.push(portraits[p++]);
                    count++;
                    if (count >= (targetGroupSize - 1)) { mode = 'landscape'; count = 0; }
                } else if (s < squares.length) {
                    result.push(squares[s++]);
                } else if (l < landscapes.length) {
                    result.push(landscapes[l++]);
                } else if (p < portraits.length) {
                    result.push(portraits[p++]);
                } else {
                    break;
                }
            }

            return result;
        }

        // ── Flickr-style justified row layout ──
        var ROW_GAP = 4;

        function layoutJustified(arts) {
            var containerWidth = grid.offsetWidth;
            var targetRowHeight = 280;
            var rows = [];
            var currentRow = [];
            var currentWidth = 0;

            arts.forEach(function(art, i) {
                var ratio = imageCache[art.src] || 1;
                var itemWidth = targetRowHeight * ratio;

                if (currentRow.length > 0 && currentWidth + itemWidth > containerWidth - ROW_GAP) {
                    // Finalize the current row
                    rows.push({ items: currentRow, totalWidth: currentWidth });
                    currentRow = [];
                    currentWidth = 0;
                }

                currentRow.push({ art: art, ratio: ratio, width: itemWidth });
                currentWidth += itemWidth + (currentRow.length > 1 ? ROW_GAP : 0);
            });

            // Push remaining items as the last row (not stretched)
            if (currentRow.length > 0) {
                rows.push({ items: currentRow, totalWidth: currentWidth, last: true });
            }

            // Render rows
            var fragment = document.createDocumentFragment();
            rows.forEach(function(row) {
                var rowEl = document.createElement('div');
                rowEl.className = 'gallery-row';

                var totalRatio = 0;
                row.items.forEach(function(it) { totalRatio += it.ratio; });

                var availableWidth = containerWidth - (row.items.length - 1) * ROW_GAP;
                var actualRowHeight = row.last
                    ? targetRowHeight
                    : Math.max(120, Math.min(500, availableWidth / totalRatio));

                row.items.forEach(function(it, idx) {
                    var item = document.createElement('div');
                    item.className = 'gallery-item';
                    item.style.cursor = 'zoom-in';

                    var img = document.createElement('img');
                    img.src = it.art.src;
                    img.alt = it.art.alt || '';
                    img.loading = 'lazy';
                    img.style.aspectRatio = it.ratio;

                    var tag = document.createElement('span');
                    tag.className = 'type-tag';
                    tag.textContent = (it.art.subtypes && it.art.subtypes[0]) || it.art.type;

                    item.appendChild(img);
                    item.appendChild(tag);

                    // Click to open lightbox — or tag picker in edit mode
                    (function(artwork, itemEl) {
                        itemEl.addEventListener('click', function(e) {
                            if (typeof editMode !== 'undefined' && editMode) {
                                e.preventDefault();
                                e.stopPropagation();
                                openTagPicker(artwork, itemEl);
                                return;
                            }
                            e.preventDefault();
                            var allIndex = arts.indexOf(artwork);
                            if (allIndex !== -1) {
                                openLightbox(arts, allIndex);
                            }
                        });
                    })(it.art, item);

                    var w = row.last
                        ? Math.round(it.ratio * actualRowHeight)
                        : Math.round((it.ratio / totalRatio) * availableWidth);
                    item.style.width = w + 'px';
                    item.style.height = actualRowHeight + 'px';

                    rowEl.appendChild(item);
                });

                fragment.appendChild(rowEl);
            });

            grid.appendChild(fragment);
        }

        // ── Lightbox viewer ──
        var lb = document.getElementById('lightbox');
        var lbImg = document.getElementById('lb-img');
        var lbClose = document.getElementById('lb-close');
        var lbPrev = document.getElementById('lb-prev');
        var lbNext = document.getElementById('lb-next');
        var lbCounter = document.getElementById('lb-counter');
        var lbLink = document.getElementById('lb-link');
        var lbArts = [];
        var lbIndex = 0;

        function openLightbox(arts, index) {
            lbArts = arts;
            lbIndex = index;
            showLightboxImage();
            lb.classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function showLightboxImage() {
            var art = lbArts[lbIndex];
            lbImg.src = art.src;
            lbImg.alt = art.alt || '';
            lbLink.href = art.link || '#';
            lbCounter.textContent = (lbIndex + 1) + ' / ' + lbArts.length;
            lbPrev.style.display = lbArts.length > 1 ? '' : 'none';
            lbNext.style.display = lbArts.length > 1 ? '' : 'none';
        }

        function closeLightbox() {
            lb.classList.remove('open');
            document.body.style.overflow = '';
        }

        function prevImage() {
            if (lbArts.length < 2) return;
            lbIndex = (lbIndex - 1 + lbArts.length) % lbArts.length;
            showLightboxImage();
        }

        function nextImage() {
            if (lbArts.length < 2) return;
            lbIndex = (lbIndex + 1) % lbArts.length;
            showLightboxImage();
        }

        // Lightbox event listeners
        lbClose.addEventListener('click', function(e) { e.stopPropagation(); closeLightbox(); });
        lbPrev.addEventListener('click', function(e) { e.stopPropagation(); prevImage(); });
        lbNext.addEventListener('click', function(e) { e.stopPropagation(); nextImage(); });
        lb.addEventListener('click', closeLightbox);
        document.getElementById('lb-img-wrap').addEventListener('click', function(e) { e.stopPropagation(); });

        document.addEventListener('keydown', function(e) {
            if (!lb.classList.contains('open')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') prevImage();
            if (e.key === 'ArrowRight') nextImage();
        });

        // ── Re-layout on resize ──
        var resizeTimer;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(function() {
                if (currentFilter) {
                    renderGallery(currentFilter, currentSubtype);
                }
            }, 250);
        });

        // ── Build subtype buttons (global — same for all types) ──
        function buildSubtypeButtons() {
            subFilterEl.innerHTML = '';
            currentSubtype = null;

            if (!subtypes || subtypes.length === 0) {
                subFilterEl.classList.remove('visible');
                return;
            }

            subFilterEl.classList.add('visible');

            subtypes.forEach(function(st) {
                var btn = document.createElement('button');
                btn.textContent = st;
                btn.setAttribute('data-subtype', st);
                btn.addEventListener('click', function() {
                    subFilterEl.querySelectorAll('button').forEach(function(b) {
                        b.classList.remove('active');
                    });
                    btn.classList.add('active');
                    currentSubtype = st;
                    renderGallery(currentFilter, currentSubtype);
                });
                subFilterEl.appendChild(btn);
            });
        }

        // ── Type filter buttons ──
        document.getElementById('filters').addEventListener('click', function(e) {
            if (e.target.tagName !== 'BUTTON') return;
            var filt = e.target.getAttribute('data-filter');
            if (!filt) return; // skip buttons without data-filter (e.g. edit toggle)
            document.querySelectorAll('#filters button').forEach(function(b) {
                b.classList.remove('active');
            });
            e.target.classList.add('active');
            currentFilter = filt;

            // Show subtypes regardless of which type is selected
            buildSubtypeButtons();

            renderGallery(currentFilter, currentSubtype);
        });

        // Initial render
        buildSubtypeButtons();
        renderGallery('all', null);

        // â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
        //  TAG EDITOR — click an image to change subtype
        // â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
        // Globals — needed by inline click handlers in layoutJustified
        var editMode = false;
        var editBtn, editPanel, editOutput;

        function initTagEditor() {
            // ── Toggle button ──
            editBtn = document.createElement('button');
            editBtn.textContent = '✎ Edit tags';
            editBtn.style.cssText = 'font-family:inherit;font-size:0.6rem;letter-spacing:2px;text-transform:uppercase;padding:0.4rem 0.8rem;border:1px solid rgba(255,255,255,0.08);border-radius:4px;background:transparent;color:rgba(255,255,255,0.2);cursor:pointer;transition:all 0.25s;margin-left:auto;';
            editBtn.onmouseenter = function(){editBtn.style.color='rgba(255,255,255,0.5)';editBtn.style.borderColor='rgba(255,255,255,0.15)';};
            editBtn.onmouseleave = function(){if(!editMode){editBtn.style.color='rgba(255,255,255,0.2)';editBtn.style.borderColor='rgba(255,255,255,0.08)';}};
            editBtn.onclick = toggleEditMode;
            document.getElementById('filters').appendChild(editBtn);

                        // Copy button next to edit button
            editPanel = document.createElement('button');
            editPanel.textContent = 'Copy';
            editPanel.style.cssText = 'font-family:inherit;font-size:0.6rem;letter-spacing:2px;text-transform:uppercase;padding:0.4rem 0.6rem;border:1px solid rgba(255,255,255,0.06);border-radius:4px;background:transparent;color:rgba(255,255,255,0.15);cursor:pointer;transition:all 0.25s;display:none;';
            editPanel.onmouseenter = function(){editPanel.style.color='rgba(255,255,255,0.4)';editPanel.style.borderColor='rgba(255,255,255,0.12)';};
            editPanel.onmouseleave = function(){editPanel.style.color='rgba(255,255,255,0.15)';editPanel.style.borderColor='rgba(255,255,255,0.06)';};
            editPanel.onclick = function() {
                var code = generateCodeOutput();
                navigator.clipboard.writeText(code).then(function() {
                    editPanel.textContent = 'Copied!';
                    setTimeout(function(){editPanel.textContent = 'Copy';}, 2000);
                });
            };
            document.getElementById('filters').appendChild(editPanel);
            editOutput = { textContent: '' };
        }

        function toggleEditMode() {
            editMode = !editMode;
            editBtn.textContent = editMode ? '✎ Done editing' : '✎ Edit tags';
            editBtn.style.color = editMode ? 'rgba(255,255,255,0.6)' : 'rgba(255,255,255,0.2)';
            editBtn.style.borderColor = editMode ? 'rgba(255,255,255,0.2)' : 'rgba(255,255,255,0.08)';
            editPanel.style.display = editMode ? 'inline-block' : 'none';
            if (editMode) {
                // Close any open lightbox
                closeLightbox();
                generateCodeOutput();
            }
            renderGallery(currentFilter, currentSubtype);
        }

        function styleItemsForEditMode() {
            grid.querySelectorAll('.gallery-item').forEach(function(el) {
                el.style.cursor = editMode ? 'pointer' : 'zoom-in';
                var tag = el.querySelector('.type-tag');
                if (tag) {
                    tag.style.background = editMode ? 'rgba(255,255,255,0.15)' : 'rgba(0,0,0,0.65)';
                    tag.style.color = editMode ? 'rgba(255,255,255,0.8)' : 'rgba(255,255,255,0.4)';
                    tag.style.fontSize = editMode ? '0.55rem' : '0.5rem';
                }
            });
        }

        function openTagPicker(artwork, itemEl) {
            if (!editMode) return;

            // Remove any existing picker
            var old = document.querySelector('.tag-picker');
            if (old) old.remove();

            var picker = document.createElement('div');
            picker.className = 'tag-picker';
            picker.style.cssText = 'position:fixed;z-index:99999;background:rgba(10,10,10,0.97);border:1px solid rgba(255,255,255,0.15);border-radius:6px;padding:0.3rem;display:flex;flex-wrap:wrap;gap:2px;max-width:260px;box-shadow:0 8px 40px rgba(0,0,0,0.6);';

            // Position picker near the clicked element, append to body
            var rect = itemEl.getBoundingClientRect();
            picker.style.left = Math.max(4, Math.min(window.innerWidth - 270, rect.left + rect.width/2 - 130)) + 'px';
            picker.style.top = Math.max(4, rect.top - 10) + 'px';
            document.body.appendChild(picker);

            subtypes.forEach(function(st) {
                var opt = document.createElement('button');
                opt.textContent = st;
                opt.setAttribute('data-tag', st);
                opt.style.cssText = 'font-family:inherit;font-size:0.5rem;letter-spacing:1px;padding:0.2rem 0.4rem;border-radius:3px;cursor:pointer;transition:all 0.15s;';
                opt.onclick = function(e) {
                    e.stopPropagation();
                    if (!artwork.subtypes) artwork.subtypes = [];
                    var idx = artwork.subtypes.indexOf(st);
                    if (idx !== -1) {
                        artwork.subtypes.splice(idx, 1);
                    } else {
                        artwork.subtypes.push(st);
                    }
                    // Update button appearance
                    var has = artwork.subtypes.indexOf(st) !== -1;
                    opt.style.border = '1px solid ' + (has ? 'rgba(255,255,255,0.25)' : 'transparent');
                    opt.style.background = has ? 'rgba(255,255,255,0.08)' : 'transparent';
                    opt.style.color = has ? 'rgba(255,255,255,0.7)' : 'rgba(255,255,255,0.25)';
                    // Update item badge
                    var badge = itemEl.querySelector('.type-tag');
                    if (badge) badge.textContent = (artwork.subtypes && artwork.subtypes[0]) || artwork.type;
                    generateCodeOutput();
                };
                // Apply initial state
                var hasTag = artwork.subtypes && artwork.subtypes.indexOf(st) !== -1;
                opt.style.border = '1px solid ' + (hasTag ? 'rgba(255,255,255,0.25)' : 'transparent');
                opt.style.background = hasTag ? 'rgba(255,255,255,0.08)' : 'transparent';
                opt.style.color = hasTag ? 'rgba(255,255,255,0.7)' : 'rgba(255,255,255,0.25)';
                opt.onmouseenter = function(){opt.style.background='rgba(255,255,255,0.05)';opt.style.color='rgba(255,255,255,0.6)';};
                opt.onmouseleave = function(){
                    var has = artwork.subtypes && artwork.subtypes.indexOf(st) !== -1;
                    opt.style.background = has ? 'rgba(255,255,255,0.08)' : 'transparent';
                    opt.style.color = has ? 'rgba(255,255,255,0.7)' : 'rgba(255,255,255,0.25)';
                };
                picker.appendChild(opt);
            });

            // Close picker when clicking outside
            function closePicker(e) {
                if (!picker.contains(e.target) && e.target !== itemEl.querySelector('img') && !itemEl.contains(e.target)) {
                    picker.remove();
                    document.removeEventListener('click', closePicker);
                }
            }
            setTimeout(function(){document.addEventListener('click', closePicker);}, 10);
        }

        function generateCodeOutput() {
            var code = 'const artworks = [\n';
            artworks.forEach(function(a, i) {
                var subs = a.subtypes && a.subtypes.length ? '["' + a.subtypes.join('", "') + '"]' : '[]';
                code += '    { src: "' + a.src + '", type: "' + a.type + '", subtypes: ' + subs + ', link: "' + a.link + '", alt: "' + (a.alt || '') + '" }';
                if (i < artworks.length - 1) code += ',';
                code += '\n';
            });
            code += '];';
            editOutput.textContent = code;
            return code;
        }

        initTagEditor();
    </script>
</body>
</html>
