name: Deploy to Uberspace
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  # The gallery is generated from the public photostream. A nightly deploy
  # refreshes it even when the repository itself hasn't changed.
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
concurrency:
  group: deploy-uberspace
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Regenerate gallery/photos.json from Flickr before building. The
      # archive lives in that file, so new uploads reach the live page without
      # anyone editing HTML. Non-fatal: a Flickr outage keeps the last copy.
      - name: Refresh gallery from Flickr
        continue-on-error: true
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pillow
          python3 tools/gallery/sync.py
      - name: Restore the built binary
        id: binary
        uses: actions/cache@v4
        with:
          path: .deploy/alice-website
          key: alice-binary-v1-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'src/**', 'templates/**', 'gallery/curation.json', 'gallery/index.html', 'socials/**') }}

      - name: Install transfer tools (lftp, sshpass)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lftp sshpass rsync

      - name: Install Rust
        if: steps.binary.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cache Rust build
        if: steps.binary.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2

      - name: Install musl-tools (static link)
        if: steps.binary.outputs.cache-hit != 'true'
        run: sudo apt-get install -y --no-install-recommends musl-tools

      - name: Build release binary (static, for the server)
        if: steps.binary.outputs.cache-hit != 'true'
        run: |
          cargo build --locked --release --target x86_64-unknown-linux-musl
          mkdir -p .deploy
          # Symbols are dead weight over SFTP; GNU strip handles the static
          # musl ELF fine. Fall back to the unstripped file if it refuses.
          strip target/x86_64-unknown-linux-musl/release/alice-website \
            -o .deploy/alice-website \
            || cp target/x86_64-unknown-linux-musl/release/alice-website .deploy/alice-website

      - name: Deploy to Uberspace
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SSHPASS: ${{ secrets.SFTP_PASSWORD }}
        run: |
          set -euo pipefail

          # 1) Sync the site incrementally. rsync compares checksums, so only
          #    new/changed files are uploaded and unchanged ones are left
          #    alone (lftp's mirror compared size+mtime, and actions/checkout
          #    stamps every file with "now", so it re-uploaded everything on
          #    every run). --delete still removes files that no longer exist
          #    in the repo, but excluded paths (the running binary) are kept.
          #    NOTE: the destination is the absolute web root (on Uberspace
          #    ~/html is a symlink into /var/www/virtual/<user>/html), which
          #    is the same path the remote setup step below uses.
          echo "==> [rsync] syncing repo to html/ ..."
          APP_DIR="/var/www/virtual/$SFTP_USERNAME/html"
          SYNC_EXCLUDES=(
            --exclude=/.git/
            --exclude=/.github/
            --exclude=/.deploy/
            --exclude=/target/
            --exclude=node_modules/
            --exclude=__pycache__/
            --exclude='*.md'
            --exclude=/alice-website
            --exclude='/alice-website.*'
          )
          RSYNC_SSH="sshpass -e ssh -p $SFTP_PORT -o StrictHostKeyChecking=no"
          if rsync -rlpt --omit-dir-times --checksum \
               --delete --delete-after --itemize-changes \
               "${SYNC_EXCLUDES[@]}" -e "$RSYNC_SSH" \
               ./ "$SFTP_USERNAME@$SFTP_HOST:$APP_DIR/"; then
            echo "==> [rsync] sync done"
          else
            # Safety net: fall back to the previous behaviour (full lftp
            # mirror) if rsync is unusable on the host. Keep this exclude
            # list in sync with SYNC_EXCLUDES above.
            echo "!! [rsync] failed — falling back to a full lftp mirror" >&2
            printf '%s\n' \
              'set sftp:auto-confirm yes' \
              'set cmd:fail-exit yes' \
              'set net:max-retries 3' \
              'mirror --reverse --delete --verbose --exclude=.git/ --exclude=.github/ --exclude=.deploy/ --exclude=target/ --exclude=node_modules/ --exclude=__pycache__/ --exclude-glob=*.md --exclude=alice-website ./ html/' \
              'bye' > "$RUNNER_TEMP/mirror.lftp"
            lftp -u "$SFTP_USERNAME,$SFTP_PASSWORD" \
              "sftp://$SFTP_HOST:$SFTP_PORT" -f "$RUNNER_TEMP/mirror.lftp"
          fi

          # 2) Upload the binary LAST (and under a temp name) so the sync
          #    above can never remove or replace the running executable.
          echo "==> [lftp] uploading binary ..."
          lftp -u "$SFTP_USERNAME,$SFTP_PASSWORD" sftp://$SFTP_HOST:$SFTP_PORT <<EOF
          set sftp:auto-confirm yes
          set cmd:fail-exit yes
          set net:max-retries 3
          put .deploy/alice-website -o html/alice-website.new
          bye
          EOF
          echo "==> [lftp] upload done"

          # 3) Make binary executable, install supervisord service, set web
          #    backend. Uberspace manages persistent daemons with supervisord
          #    (NOT systemd user services — `systemctl --user` / linger don't
          #    exist there). Service config = one .ini in ~/etc/services.d/.
          echo "==> [ssh] running remote setup ..."
          sshpass -p "$SFTP_PASSWORD" ssh -p "$SFTP_PORT" -o StrictHostKeyChecking=no \
            "$SFTP_USERNAME@$SFTP_HOST" "SFTP_USER='$SFTP_USERNAME' bash -l -s" <<'REMOTE'
          set -e
          trap 'echo "REMOTE FAILED at line $LINENO: $BASH_COMMAND"' ERR
          USER_NAME="${SFTP_USER:?SFTP_USER not set}"
          APP_DIR="/var/www/virtual/$USER_NAME/html"
          SERVICE_NAME="alice-website"
          REAL_HOME="$(getent passwd "$USER_NAME" | cut -d: -f6)"
          [ -n "$REAL_HOME" ] || REAL_HOME="$HOME"

          echo "[1/6] install binary"
          # Identical bytes mean there is nothing to swap -- and, just as
          # importantly, no reason to restart the service and drop requests.
          if [ -f "$APP_DIR/alice-website" ] && cmp -s "$APP_DIR/alice-website" "$APP_DIR/alice-website.new"; then
            echo "  binary unchanged; keeping the running process"
            rm -f "$APP_DIR/alice-website.new"
            BINARY_CHANGED=0
          else
            mv -f "$APP_DIR/alice-website.new" "$APP_DIR/alice-website"
            chmod +x "$APP_DIR/alice-website"
            BINARY_CHANGED=1
          fi
          echo "[2/6] write supervisord ini"
          mkdir -p "$REAL_HOME/etc/services.d"
          # The blog is a WriteFreely instance on this same host, so the site
          # reads its feeds over loopback: plain HTTP, never off the machine,
          # which is why the binary carries no TLS client. Keep this port in
          # step with `port` in the WriteFreely config.ini.
          printf '%s\n' \
            "[program:$SERVICE_NAME]" \
            "command=$APP_DIR/alice-website" \
            "directory=$APP_DIR" \
            'startsecs=60' \
            'autorestart=true' \
            'redirect_stderr=true' \
            'environment=BLOG_FEED_BASE="http://127.0.0.1:8082"' \
            > "$REAL_HOME/etc/services.d/$SERVICE_NAME.ini"
          echo "[3/6] supervisorctl reread"
          supervisorctl reread
          echo "[4/6] supervisorctl update"
          supervisorctl update
          echo "[5/6] restart service"
          if [ "$BINARY_CHANGED" = 1 ] || ! supervisorctl status "$SERVICE_NAME" | grep -q RUNNING; then
            supervisorctl restart "$SERVICE_NAME" || supervisorctl start "$SERVICE_NAME"
          else
            echo "  service already running the current binary"
          fi
          supervisorctl status "$SERVICE_NAME" || true
          echo "[6/6] set web backend"
          command -v uberspace >/dev/null 2>&1 || export PATH="$PATH:/usr/local/bin"
          uberspace web backend set / --http --port 8080
          echo "REMOTE setup complete"
          REMOTE
          echo "==> [ssh] remote setup done"
