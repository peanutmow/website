[package]
name = "wasm-water-sim"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlElement", "HtmlPreElement",
    "MouseEvent", "EventTarget", "console",
    "KeyboardEvent",
] }

[profile.release]
opt-level = "s"
lto = true
